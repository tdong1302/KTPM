services:
  postgres:
    image: postgres:16-alpine
    container_name: eventhub-ktpm-db
    environment:
      POSTGRES_USER: eventhub
      POSTGRES_PASSWORD: eventhub
      POSTGRES_DB: eventhub_ktpm
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventhub -d eventhub_ktpm"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    container_name: eventhub-ktpm-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://eventhub:eventhub@postgres:5432/eventhub_ktpm
      # The baseline creates its schema at startup. Swap to Alembic when the schema
      # starts evolving in Phase 2.
      DB_AUTO_CREATE: "true"
      DB_POOL_SIZE: "5"
      DB_MAX_OVERFLOW: "10"
      JWT_SECRET: local-development-secret-change-me
      JWT_EXPIRES_MINUTES: "1440"
      BCRYPT_ROUNDS: "12"
      ENVIRONMENT: docker
    ports:
      - "8000:8000"

volumes:
  postgres-data:
