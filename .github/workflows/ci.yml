name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: eventhub_ci
          POSTGRES_PASSWORD: eventhub_ci_local_only
          POSTGRES_DB: eventhub_ci_disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eventhub_ci -d eventhub_ci_disposable"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    env:
      DATABASE_URL: postgresql+psycopg://eventhub_ci:eventhub_ci_local_only@127.0.0.1:5432/eventhub_ci_disposable
      TEST_DATABASE_URL: postgresql+psycopg://eventhub_ci:eventhub_ci_local_only@127.0.0.1:5432/eventhub_ci_disposable
      REQUIRE_POSTGRES_TESTS: "1"
      DB_AUTO_CREATE: "false"
      BCRYPT_ROUNDS: "4"
      ENVIRONMENT: ci
      JWT_SECRET: ci-ephemeral-secret-never-used-outside-this-workflow

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.13"
          python-version: "3.11"
          enable-cache: true

      - name: Install frozen development dependencies
        run: uv sync --frozen --extra dev

      - name: Run PostgreSQL test preflight
        env:
          DATABASE_URL: ""
        run: uv run --frozen python scripts/preflight.py --mode postgres-test

      - name: Check formatting
        run: uv run --frozen ruff format --check app tests alembic scripts

      - name: Lint
        run: uv run --frozen ruff check app tests alembic scripts

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Migrate empty PostgreSQL database
        run: uv run --frozen python -m alembic upgrade head

      - name: Verify migration head and constraints
        run: |
          uv run --frozen python -m alembic current
          uv run --frozen python scripts/verify_postgres_schema.py

      - name: Run architecture tests explicitly
        run: uv run --frozen pytest tests/unit/test_architecture.py

      - name: Run full suite with PostgreSQL and coverage
        run: >-
          uv run --frozen pytest
          --junitxml=test-results.xml
          --cov=app
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=95

      - name: Build and start containerized API
        env:
          POSTGRES_PORT: "55432"
          POSTGRES_PASSWORD: compose-ci-local-only
          POSTGRES_DB: eventhub_compose_ci
          JWT_SECRET: compose-ci-ephemeral-secret-at-least-32-characters
        run: docker compose up -d --build api

      - name: Smoke test containerized API
        run: uv run --frozen python scripts/smoke_api.py --base-url http://127.0.0.1:8000

      - name: Capture Compose logs
        if: always()
        run: docker compose logs --no-color > compose.log 2>&1 || true

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            test-results.xml
            coverage.xml
            compose.log

      - name: Stop disposable containers
        if: always()
        run: docker compose down -v --remove-orphans
